[package]
name = "ntfs"
description = "NTFS volume + filesystem tooling"
homepage = "https://github.com/omerbenamram/mft"
repository = "https://github.com/omerbenamram/mft"
license = "MIT/Apache-2.0"
readme = "README.md"

version = "0.1.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2024"
rust-version = "1.90"

[dependencies]
log = { version = "0.4", features = ["release_max_level_debug"] }
thiserror = "2"
byteorder = "1"
jiff = { version = "0.2.16", default-features = false, features = ["std", "alloc", "serde", "perf-inline"] }
lru = "0.16.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bitflags = "2"
aes = "0.8"
des = "0.8"
md-5 = "0.10"
openssl = { version = "0.10", features = ["vendored"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"

# Reuse the existing MFT parser for record decoding (MIT/Apache).
mft = { path = "../..", version = "0.7.0" }

[dev-dependencies]
# Used by regression tests that validate file content hashes against `testdata/ntfs/ntfs1-gen2.xml`.
sha1 = "0.10"
assert_cmd = "2.1.1"
predicates = "3.1"
tempfile = "3.23"

[target.'cfg(target_os = "linux")'.dependencies]
# Optional mount frontend: FUSE (Linux-only; `fuser` requires libfuse on non-Linux platforms).
fuser = { version = "0.16.0", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
# Optional mount frontend: Dokan
dokan = { version = "0.3.1", optional = true }
# `dokan`'s public traits use `widestring` types (e.g. `U16CStr`).
widestring = { version = "0.4.3", optional = true }
# Use the idiomatic Windows projection (requested).
windows = { version = ">=0.59, <=0.62", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
default = []

fuse = ["dep:fuser", "dep:libc"]
dokan = ["dep:dokan", "dep:windows", "dep:widestring"]

[[bin]]
name = "ntfs-info"
path = "src/bin/ntfs_info.rs"

[[bin]]
name = "ntfs-mount"
path = "src/bin/ntfs_mount.rs"
